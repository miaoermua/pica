name: OpenWrt Rust Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "**/*.md"
      - "clippy.toml"
      - "dprint.json"
      - "rustfmt.toml"
      - ".github/workflows/openwrt-rust-binaries.yml"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Markdown formatting
        uses: dprint/check@v2.3

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            toolchain: stable
          - target: aarch64-unknown-linux-musl
            arch: arm64
            toolchain: stable
          # Little-endian MIPS32r2, soft-float: ramips (mt7621/mt7628) and the
          # other mipsel_24kc routers. A tier-3 target since Rust 1.72, so it
          # has no prebuilt std: nightly builds one from rust-src.
          - target: mipsel-unknown-linux-musl
            arch: mipsel
            toolchain: nightly
            build_std: "-Zbuild-std=std,panic_abort"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # A tier-3 target cannot be added; its std comes from rust-src.
          targets: ${{ matrix.build_std == '' && matrix.target || '' }}
          components: ${{ matrix.build_std != '' && 'rust-src' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build pica binaries
        run: |
          cross +${{ matrix.toolchain }} build --release \
            --target "${{ matrix.target }}" \
            -p pica-pkg-cli \
            -p pica-pkg-pack \
            ${{ matrix.build_std }}

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          mkdir -p dist
          arch="${{ matrix.arch }}"

          cp "target/${{ matrix.target }}/release/pica" "dist/pica.${arch}"
          cp "target/${{ matrix.target }}/release/pica-pack" "dist/pica-pack.${arch}"
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"

      - name: Upload pica artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica.${{ steps.prepare_artifacts.outputs.arch }}
          path: dist/pica.${{ steps.prepare_artifacts.outputs.arch }}

      - name: Upload pica-pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica-pack.${{ steps.prepare_artifacts.outputs.arch }}
          path: dist/pica-pack.${{ steps.prepare_artifacts.outputs.arch }}

  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pica*
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
