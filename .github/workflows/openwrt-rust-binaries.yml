name: OpenWrt Rust Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "**/*.md"
      - "clippy.toml"
      - "dprint.json"
      - "rustfmt.toml"
      - ".github/workflows/openwrt-rust-binaries.yml"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Markdown formatting
        uses: dprint/check@v2.3

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            toolchain: stable
            toolchain_url: ""
            toolchain_sha256: ""
            linker: ""
          - target: aarch64-unknown-linux-musl
            arch: arm64
            toolchain: stable
            toolchain_url: ""
            toolchain_sha256: ""
            linker: ""
          # Little-endian MIPS32r2, soft-float: ramips (mt7621/mt7628) and the
          # other mipsel_24kc routers. A tier-3 target since Rust 1.72, so it
          # has no prebuilt std: nightly builds one from rust-src.
          #
          # `cross` publishes images for the gnu MIPS targets only, so this one
          # is not built in a container. The linker and the libc that a tier-3
          # target has no rust-std component for come from OpenWrt's own
          # toolchain, which is what the target devices run: x86_64-hosted,
          # checksummed by the release, and carrying the `libc.a` and crt
          # objects a static link needs.
          - target: mipsel-unknown-linux-musl
            arch: mipsel
            toolchain: nightly
            build_std: "-Zbuild-std=std,panic_abort"
            toolchain_url: "https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-toolchain-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            toolchain_sha256: "0521891369a3f9f8d85b35ef99e84fd533f7e6f1835a96b0f09d2b98d9d08946"
            linker: mipsel-openwrt-linux-musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # A tier-3 target cannot be added; its std comes from rust-src.
          targets: ${{ matrix.build_std == '' && matrix.target || '' }}
          components: ${{ matrix.build_std != '' && 'rust-src' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.toolchain_url == ''
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      # 48 MB from a single host, on every run. Cached by checksum, so a repeat
      # build never touches the network and a mirror outage only costs one run.
      - name: Cache the musl cross toolchain
        if: matrix.toolchain_url != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: pica-toolchain-${{ matrix.target }}-${{ matrix.toolchain_sha256 }}

      - name: Install the musl cross toolchain
        if: matrix.toolchain_url != ''
        env:
          TOOLCHAIN: ${{ runner.temp }}/toolchain
          LINKER: ${{ matrix.linker }}
        run: |
          set -eu
          mkdir -p "$TOOLCHAIN"
          if [ ! -x "$TOOLCHAIN/bin/$LINKER" ]; then
            archive="${RUNNER_TEMP}/toolchain.tar.zst"
            # --speed-limit turns a stalled transfer into a failure after 30s of
            # near-zero progress, which is the case a plain --retry waits out
            # forever; --retry-all-errors also covers the reset and timeout
            # cases that --retry alone ignores.
            curl -fsSL \
              --connect-timeout 30 --max-time 900 \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --speed-limit 8192 --speed-time 30 \
              -o "$archive" "${{ matrix.toolchain_url }}"
            echo "${{ matrix.toolchain_sha256 }}  ${archive}" | sha256sum -c -

            # The archive holds <release>/<toolchain>/…; two levels down is the
            # sysroot, so stripping them leaves bin/ and lib/ where the linker
            # and libc.a are expected instead of a name that has to be guessed.
            rm -rf "$TOOLCHAIN"
            mkdir -p "$TOOLCHAIN"
            tar --zstd -xf "$archive" -C "$TOOLCHAIN" --strip-components=2
            rm -f "$archive"
          fi

          test -x "$TOOLCHAIN/bin/$LINKER"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Build pica binaries
        env:
          # rustc's default linker for this target is `cc`, the host compiler,
          # which cannot link a mipsel object.
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          # This target defaults to dynamic linking, unlike the two musl
          # targets above, so the artifact would depend on the device's musl
          # and libgcc_s. Static, like every other artifact Pica publishes.
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -eu
          args=(--release --target "${{ matrix.target }}"
                -p pica-pkg-cli -p pica-pkg-pack ${{ matrix.build_std }})
          if [ -n "${{ matrix.toolchain_url }}" ]; then
            cargo "+${{ matrix.toolchain }}" build "${args[@]}"
          else
            cross "+${{ matrix.toolchain }}" build "${args[@]}"
          fi

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          mkdir -p dist
          arch="${{ matrix.arch }}"

          cp "target/${{ matrix.target }}/release/pica" "dist/pica.${arch}"
          cp "target/${{ matrix.target }}/release/pica-pack" "dist/pica-pack.${arch}"
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"

      - name: Upload pica artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica.${{ steps.prepare_artifacts.outputs.arch }}
          path: dist/pica.${{ steps.prepare_artifacts.outputs.arch }}

      - name: Upload pica-pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica-pack.${{ steps.prepare_artifacts.outputs.arch }}
          path: dist/pica-pack.${{ steps.prepare_artifacts.outputs.arch }}

  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pica*
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
